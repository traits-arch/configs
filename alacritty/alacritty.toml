# ~/.config/alacritty/alacritty.toml

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
size = 11.0 # Adjust size to match your preference


[colors.primary]
background = "#111214"
foreground = "#E8E8E8"

[colors.cursor]
text = "#111214"
cursor = "#E52B2B"

[colors.normal]
black   = "#111214"
red     = "#E52B2B"
green   = "#B8B8B8"
yellow  = "#D8D8D8"
blue    = "#8F8F8F"
magenta = "#F0F0F0"
cyan    = "#A6A6A6"
white   = "#E8E8E8"

[colors.bright]
black   = "#303136"
red     = "#FF3838"
green   = "#C8C8C8"
yellow  = "#E5E5E5"
blue    = "#A8A8A8"
magenta = "#FFFFFF"
cyan    = "#C0C0C0"
white   = "#FFFFFF"
[window]
padding.x = 16
padding.y = 16
opacity = 0.95  # Adjust transparency between 0.0 (invisible) and 1.0 (opaque)
blur = true    # Requests the compositor to blur behind the window
decorations = "None"
